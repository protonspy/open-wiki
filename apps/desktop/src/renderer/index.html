<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The renderer loads nothing from anywhere. `default-src 'none'` is the
      floor; the wiki is local markdown and a page that could fetch would be a
      page an agent could use to send the project somewhere.
    -->
    <!--
      `base-uri` and `form-action` do not inherit from `default-src`, so they
      are named: without them a page could retarget every relative URL, or post
      the project somewhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>open-wiki</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
