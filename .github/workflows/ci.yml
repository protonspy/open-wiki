name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The coverage floor every app has to clear. vitest.shared.ts carries the same
  # number so the failure happens locally first; scripts/ci/check-coverage.mjs
  # re-reads it here so a package cannot configure its own gate away.
  COVERAGE_THRESHOLD: "76"
  # Nothing in CI starts a window. The Electron entry point is wiring, and
  # every module worth testing sits beside it importing no Electron at all, so
  # fetching the ~100 MB runtime once per matrix job buys nothing. The
  # installer build (plan 10.1) is where it is actually needed.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # One matrix entry per workspace package that has tests. Runs on Linux because
  # it only reads package.json files — nothing is installed or built here.
  discover:
    name: Discover workspace
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scan.outputs.packages }}
      any: ${{ steps.scan.outputs.any }}
      rust: ${{ steps.scan.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: scan
        run: node scripts/ci/workspace-packages.mjs >> "$GITHUB_OUTPUT"

  # Windows because that is the only platform the product supports.
  test:
    name: test · ${{ matrix.package.path }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      # One package failing must not hide the state of the others.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm --filter "${{ matrix.package.name }}" run ${{ matrix.package.script }}

      - name: Enforce the coverage floor
        run: node scripts/ci/check-coverage.mjs "${{ matrix.package.path }}"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package.slug }}
          path: ${{ matrix.package.path }}/coverage
          if-no-files-found: ignore
          retention-days: 7

  checks:
    name: typecheck & lint
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

  # Skipped until crates/ exists. No coverage gate here: the recorder is driven
  # through its JSON-RPC boundary, and a line count over WASAPI glue would
  # measure the wrong thing.
  rust:
    name: rust
    needs: discover
    if: needs.discover.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo test --locked --all-features

  # 10.6 — the plugin is a manifest and a hooks file, and a malformed one
  # fails at `/plugin install` on somebody else's machine. Ubuntu because it
  # only reads JSON.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The marketplace and the plugin manifest are well formed
        run: node scripts/ci/check-plugin.mjs

      # A failed *install* is tolerated — a registry outage is not a finding
      # about this repository. A failed *validation* is not: `continue-on-error`
      # made the `|| exit 1` inert, so the step reported success whatever the
      # tool said — which is exactly what check-plugin.mjs's own header calls
      # "a check that silently passes when its tool is missing".
      - name: claude plugin validate --strict
        run: |
          if ! npm i -g @anthropic-ai/claude-code >/dev/null 2>&1; then
            echo "could not install the Claude Code CLI — skipped (check-plugin.mjs still ran)"
            exit 0
          fi
          # Both, because they are different manifests: validating the
          # marketplace reads `.claude-plugin/marketplace.json` and stops — it
          # never opens the plugin's own manifest.
          claude plugin validate --strict .
          claude plugin validate --strict ./plugins/open-wiki

  # The single check to require on the branch. Skipped jobs are fine — an empty
  # workspace has nothing to test — but a failed or cancelled one is not.
  ci:
    name: CI
    if: always()
    needs: [discover, test, checks, rust, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Report
        run: |
          echo "discover: ${{ needs.discover.result }}"
          echo "test:     ${{ needs.test.result }}"
          echo "checks:   ${{ needs.checks.result }}"
          echo "rust:     ${{ needs.rust.result }}"
          echo "plugin:   ${{ needs.plugin.result }}"
