# The cargo workspace. The only thing written in Rust is the audio recorder
# (plan group 4, `adr:0014-typescript-everywhere-except-audio-capture`); everything
# else is TypeScript. The member is a skeleton until group 4 is built.
[workspace]
members = ["crates/recorder"]
resolver = "2"

[workspace.lints.rust]
# WASAPI capture needs unsafe; until then, deny it so the skeleton cannot
# quietly grow an unsafe block that group 4 did not decide to add.
unsafe_code = "deny"